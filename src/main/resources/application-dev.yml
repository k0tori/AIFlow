# ============================================================
# AIFlow - Development Profile
# ============================================================

server:
  port: 8080

# ----- PostgreSQL -----
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/aiflow
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # ----- Flyway -----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ----- Redis -----
  data:
    redis:
      host: localhost
      port: 16379
      timeout: 3000ms

  # ----- RabbitMQ -----
  rabbitmq:
    host: localhost
    port: 15672
    username: admin
    password: 123456
    virtual-host: /

  # ----- Spring AI (DeepSeek via OpenAI-compatible API) -----
  ai:
    openai:
      api-key: sk-d2e815581c774d748ae2b52279cf6c7f
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

    # ----- Ollama for local Embedding -----
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: false
      embedding:
        options:
          model: qwen3-embedding:0.6b

# ----- MyBatis-Plus -----
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aiflow.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ----- Knife4j (API Docs) -----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# ----- AIFlow RAG -----
aiflow:
  rag:
    retrieve-top-k: 20
    rerank-top-n: 5
  rerank:
    base-url: http://localhost:8787
    enabled: true
    timeout: 30s
