services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiflow-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: aiflow
    volumes:
      - /home/kotori/AIFlow/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiflow-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - /home/kotori/AIFlow/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aiflow-rabbitmq
    restart: unless-stopped
    ports:
      - "15673:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
    volumes:
      - /home/kotori/AIFlow/data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: aiflow-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /home/kotori/AIFlow/data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  rerank:
    build:
      context: ./reranker
    container_name: aiflow-rerank
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - MAX_LENGTH=1024
      - MODEL=BAAI/bge-reranker-v2-m3
      - DEVICE=cpu
    volumes:
      - /home/kotori/AIFlow/data/reranker-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/docs"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

